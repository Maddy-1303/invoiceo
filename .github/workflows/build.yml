name: Build and Release Invoiceo

on:
  push:
    tags:
      - "v*"
      - "test-v*"

# Required so GITHUB_TOKEN can create releases and upload assets
permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────────────────────
  # Windows — build .exe installer
  # ─────────────────────────────────────────────────────────────
  build-windows:
    if: ${{ vars.BUILD_WINDOWS == 'true' }}
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          cache: true

      #      - name: Setup Visual Studio Build Tools
      #        uses: microsoft/setup-msbuild@v1

      - name: Setup MSVC Development Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          IS_TEST_BUILD="false"
          if [[ "$VERSION" == test-v* ]]; then IS_TEST_BUILD="true"; fi
          VERSION="${VERSION#test-v}"
          VERSION="${VERSION#v}"
          sed -i "s/^version: .*/version: $VERSION/" pubspec.yaml
          echo "Building version: $VERSION (test build: $IS_TEST_BUILD)"
          sed -i "s|__IS_TEST_BUILD__|$IS_TEST_BUILD|g" lib/common/constants.dart
          sed -i "s|__BUILD_TIMESTAMP__|$(date +%s)|g" lib/common/constants.dart
          sed -i "s|static const version = \"v[^\"]*\";|static const version = \"v$VERSION\";|" lib/common/app_config.dart

      - name: Install FastForge
        run: dart pub global activate fastforge

      - name: Flutter Pub Get
        run: flutter pub get

      #      - name: Build Flutter Windows Release
      #        run: flutter build windows --release
      #        env:
      #          CMAKE_GENERATOR: "Visual Studio 17 2022"

      - name: Build Windows Installer with FastForge
        run: fastforge package --platform windows --targets exe
        env:
          CMAKE_GENERATOR: "Visual Studio 17 2022"

      - name: Verify installer exists
        shell: bash
        run: |
          count=$(find dist -name "invoiceo-*-windows-setup.exe" | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "ERROR: No installer found in dist/"
            find dist -type f
            exit 1
          fi
          echo "Found installer(s):"
          find dist -name "invoiceo-*-windows-setup.exe"

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: Invoiceo-Windows-Installer
          path: dist/*/invoiceo-*-windows-setup.exe

  # ─────────────────────────────────────────────────────────────
  # Linux — build .deb package
  # ─────────────────────────────────────────────────────────────
  build-linux:
    if: ${{ vars.BUILD_LINUX_DEB22 == 'true' }}
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          cache: true

      - name: Setup build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev patchelf squashfs-tools

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          IS_TEST_BUILD="false"
          if [[ "$VERSION" == test-v* ]]; then IS_TEST_BUILD="true"; fi
          VERSION="${VERSION#test-v}"
          VERSION="${VERSION#v}"
          sed -i "s/^version: .*/version: $VERSION/" pubspec.yaml
          echo "Building version: $VERSION (test build: $IS_TEST_BUILD)"
          sed -i "s|__IS_TEST_BUILD__|$IS_TEST_BUILD|g" lib/common/constants.dart
          sed -i "s|__BUILD_TIMESTAMP__|$(date +%s)|g" lib/common/constants.dart
          sed -i "s|static const version = \"v[^\"]*\";|static const version = \"v$VERSION\";|" lib/common/app_config.dart

      - name: Install FastForge
        run: dart pub global activate fastforge

      - name: Flutter Pub Get
        run: flutter pub get

      #      - name: Build Flutter Linux Release
      #        run: flutter build linux --release

      - name: Build .deb Package
        run: |
          fastforge package --platform linux --targets deb
          VERSION="${GITHUB_REF#refs/tags/}"
          VERSION="${VERSION#test-v}"
          VERSION="${VERSION#v}"
          DEB_FILE=$(find dist/$VERSION -name "*.deb" | head -1)
          echo "Found deb: $DEB_FILE"
          mv "$DEB_FILE" Invoiceo-$VERSION-ubuntu22.deb

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: Invoiceo-Ubuntu22.deb
          path: Invoiceo-*-ubuntu22.deb

  # ─────────────────────────────────────────────────────────────
  # Linux — build .deb for Ubuntu 24.04
  # Compiled natively on ubuntu-24.04 for modern systems (e.g.
  # Ryzen 7000 series) running Ubuntu 24.04 (Noble).
  # ─────────────────────────────────────────────────────────────
  build-linux-ubuntu24:
    if: ${{ vars.BUILD_LINUX_DEB24 == 'true' }}
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          cache: true

      - name: Setup build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev patchelf squashfs-tools

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          IS_TEST_BUILD="false"
          if [[ "$VERSION" == test-v* ]]; then IS_TEST_BUILD="true"; fi
          VERSION="${VERSION#test-v}"
          VERSION="${VERSION#v}"
          sed -i "s/^version: .*/version: $VERSION/" pubspec.yaml
          echo "Building version: $VERSION (test build: $IS_TEST_BUILD)"
          sed -i "s|__IS_TEST_BUILD__|$IS_TEST_BUILD|g" lib/common/constants.dart
          sed -i "s|__BUILD_TIMESTAMP__|$(date +%s)|g" lib/common/constants.dart
          sed -i "s|static const version = \"v[^\"]*\";|static const version = \"v$VERSION\";|" lib/common/app_config.dart

      - name: Install FastForge
        run: dart pub global activate fastforge

      - name: Flutter Pub Get
        run: flutter pub get

      #      - name: Build Flutter Linux Release
      #        run: flutter build linux --release

      - name: Build .deb Package
        run: |
          fastforge package --platform linux --targets deb
          VERSION="${GITHUB_REF#refs/tags/}"
          VERSION="${VERSION#test-v}"
          VERSION="${VERSION#v}"
          DEB_FILE=$(find dist/$VERSION -name "*.deb" | head -1)
          echo "Found deb: $DEB_FILE"

          # ── Inject libsqlite3.so and create LD_LIBRARY_PATH launcher ──────────
          # sqflite_common_ffi calls DynamicLibrary.open("libsqlite3.so") which
          # needs the unversioned symlink.  Ubuntu 24.04 only ships libsqlite3.so.0
          # in the runtime package; the unversioned name requires libsqlite3-dev.
          # Bundle it so the app always finds it regardless of what the user has
          # installed.
          mkdir -p /tmp/deb_root
          dpkg-deb -R "$DEB_FILE" /tmp/deb_root

          echo "--- deb contents ---"
          find /tmp/deb_root -type f | sort

          mkdir -p /tmp/deb_root/usr/share/invoiceo/lib
          # Bundle libsqlite3 into the application's lib directory
          mkdir -p /tmp/deb_root/opt/invoiceo/lib

          LIBSQLITE=$(find /usr/lib -name "libsqlite3.so.0.*" | sort -V | tail -1)
          if [ -z "$LIBSQLITE" ]; then
            sudo apt-get install -y libsqlite3-dev
            LIBSQLITE=$(find /usr/lib -name "libsqlite3.so.0.*" | sort -V | tail -1)
          fi
          echo "Bundling libsqlite3: $LIBSQLITE"
          cp "$LIBSQLITE" /tmp/deb_root/usr/share/invoiceo/lib/libsqlite3.so
          cp "$LIBSQLITE" /tmp/deb_root/opt/invoiceo/lib/libsqlite3.so

          echo "Contents of opt/invoiceo/lib:"
          ls -l /tmp/deb_root/opt/invoiceo/lib

          echo "Injected libsqlite3.so into deb at /usr/share/invoiceo/lib/"
          echo "Injected libsqlite3.so into deb at /opt/invoiceo/lib/"

          dpkg-deb -b /tmp/deb_root "$DEB_FILE"
          echo "Repacked with LD_LIBRARY_PATH launcher"

          mv "$DEB_FILE" Invoiceo-$VERSION-ubuntu24.deb

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: Invoiceo-Ubuntu24.deb
          path: Invoiceo-*-ubuntu24.deb

  # Old appimage-builder AppImage job — disabled: appimage-builder hardcodes
